<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https:; script-src 'self'" />
  <title>OP.GG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/fonts.css" />
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/components.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header" id="app-header">
      <img class="app-header__logo" src="assets/images/icon-opggsquare.svg" alt="OP.GG" width="32" height="32" />
      <img class="app-header__game-icon" src="assets/images/img-sidebar-lol.svg" alt="" width="24" height="24" />
      <div class="app-header__title">League of Legends</div>
      <div class="app-header__actions">
        <span class="app-status" id="app-status" data-state="offline" title="League Client status">
          <span class="app-status__dot" aria-hidden="true"></span>
          <span class="app-status__label">Offline</span>
        </span>
      </div>
    </header>

    <div class="app-body">
      <nav class="app-side" id="app-side" aria-label="Primary"></nav>
      <main class="app-main" id="app-main" tabindex="-1"></main>
    </div>

    <div class="app-overlay-root" id="app-overlay-root"></div>
    <div class="toast-stack" id="toast-stack" role="status" aria-live="polite"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
